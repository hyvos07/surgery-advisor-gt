[project]
name = "surgery-advisor"
version = "0.1.0"
description = "Rule-based advisor for Growtopia surgeries, tested against the SurgE simulator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Web viewer only; src/advisor uses the standard library only.
    "fastapi",
    "uvicorn",
]

[project.scripts]
surg = "cli:main"

[dependency-groups]
dev = [
    "mypy",
    "pre-commit",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advisor", "src/harness", "src/web"]
only-include = ["src/advisor", "src/harness", "src/web", "src/cli.py"]
sources = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["vendor"]

[tool.ruff.format]
# Code blocks in the docs are illustrative; don't reformat them.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
